  #     - ./models:/models:ro
  #   environment:
  #     - USE_GPU=true
  #     - DATA_DIR=/data
  #     - MATCH_TAU=0.775
  #     - MATCH_MARGIN=0.02
  #     - TAU_HIGH=0.87
  #     - TAU_LOW=0.75
  #     - MARGIN_HIGH=0.02
  #     - LLM_BASE_URL=http://host.docker.internal:15721
  #     - LLM_CATEGORY_MODEL=qwen3.7-flash
  #     - LLM_FALLBACK_MODEL=qwen3.7-flash
