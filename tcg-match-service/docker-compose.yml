  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   restart: unless-stopped

  # 索引构建（一次性运行）
  build-index:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tcg-build-index
    volumes:
      - ./data:/data
      - ./models:/models
    environment:
      - USE_GPU=false
      - DATA_DIR=/data
    command: ["python", "scripts/build_index.py", "--category", "all", "--type", "all"]
    profiles:
      - build