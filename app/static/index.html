<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCG 卡牌搜索 - Top-5 / OCR</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117;
    --surface: #1a1d28;
    --surface2: #232738;
    --border: #2e3348;
    --text: #e1e4ed;
    --text2: #8b8fa3;
    --accent: #5b8def;
    --green: #34d399;
    --orange: #f59e0b;
    --radius: 8px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  .container { width: 100%; max-width: 640px; padding: 24px 16px; }

  header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .badge {
    font-size: 11px; color: var(--text2); background: var(--surface2);
    padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border);
  }
  .status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-left: auto; background: var(--text2);
  }
  .status-dot.ok { background: var(--green); }
  .status-dot.err { background: #f87171; }

  /* Tabs */
  .tabs {
    display: flex; gap: 4px; margin-bottom: 16px;
    background: var(--surface); border-radius: var(--radius);
    padding: 4px; border: 1px solid var(--border);
  }
  .tab {
    flex: 1; text-align: center; padding: 8px 12px; border-radius: 6px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    color: var(--text2); transition: all 0.15s; border: none; background: none;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--accent); color: #fff; }
  .panel { display: none; }
  .panel.active { display: block; }

  .drop-zone {
    border: 2px dashed var(--border); border-radius: var(--radius);
    padding: 48px 24px; text-align: center; cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    background: var(--surface);
  }
  .drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: var(--surface2); }
  .drop-zone .icon { font-size: 36px; margin-bottom: 12px; opacity: 0.6; }
  .drop-zone p { color: var(--text2); font-size: 14px; }
  .drop-zone .hint { font-size: 12px; color: var(--text2); margin-top: 8px; opacity: 0.5; }

  .preview-area { display: none; margin-top: 16px; position: relative; }
  .preview-area.show { display: block; }
  .preview-area img {
    width: 100%; max-height: 320px; object-fit: contain;
    border-radius: var(--radius); background: var(--surface);
    border: 1px solid var(--border);
  }
  .preview-actions {
    display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); font-size: 13px;
    cursor: pointer; transition: background 0.15s;
  }
  .btn:hover { background: var(--border); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { opacity: 0.9; }
  .btn.ocr { background: var(--orange); border-color: var(--orange); color: #fff; }
  .btn.ocr:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn .spinner {
    display: none; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.6s linear infinite;
  }
  .btn.loading .spinner { display: inline-block; }
  .btn.loading .label { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

/* Search result */
 .search-result { display: none; margin-top: 16px; }
 .search-result.show { display: block; }
 .search-result .card {
   background: var(--surface); border: 1px solid var(--border);
   border-radius: var(--radius); padding: 16px; overflow: hidden;
 }
 .search-header {
   display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
 }
 .search-header .label { font-size: 13px; font-weight: 600; color: var(--text); }
 .search-header .time { font-size: 12px; color: var(--text2); margin-left: auto; }

  .preprocess-result { display: none; margin-bottom: 12px; padding: 10px; background: var(--surface2); border-radius: 6px; }
  .preprocess-result.show { display: block; }
  .preprocess-header { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .preprocess-header .label { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }
  .preprocess-result img { width: 100%; max-height: 180px; object-fit: contain; border-radius: 4px; background: var(--bg); border: 1px solid var(--border); }
  .preprocess-hint { font-size: 11px; color: var(--text2); margin-top: 4px; opacity: 0.6; }

  .warnings-bar { display: none; margin-bottom: 12px; padding: 10px 12px; background: rgba(245,158,11,0.10); border: 1px solid rgba(245,158,11,0.45); border-radius: 6px; color: #fbbf24; font-size: 13px; }
  .warnings-bar.show { display: block; }
  .warnings-bar div { margin: 2px 0; }

  .top5-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .top5-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 6px; background: var(--surface2);
    border: 1px solid transparent; transition: border-color 0.15s;
  }
  .top5-wrap:first-child .top5-item { border-color: rgba(91,141,239,0.4); }
  .top5-rank { font-size: 12px; font-weight: 700; min-width: 20px; text-align: center; color: var(--text2); }
  .top5-wrap:first-child .top5-rank { color: var(--accent); font-size: 14px; }
  .top5-item img { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; background: var(--bg); border: 1px solid var(--border); flex-shrink: 0; cursor: zoom-in; }
  .top5-info { flex: 1; min-width: 0; }
  .top5-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top5-sub { font-family: monospace; font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top5-score { font-family: monospace; font-size: 13px; color: var(--text2); }
  .top5-bar-outer { width: 60px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .top5-bar-inner { height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.4s ease; }
  .top5-wrap:first-child .top5-bar-inner { background: var(--green); }
  .top5-json { padding: 0 12px 8px; }
  .top5-json summary { font-size: 11px; color: var(--text2); cursor: pointer; user-select: none; }
  .top5-json summary:hover { color: var(--accent); }
  .top5-json pre { margin: 6px 0 0; padding: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; font-size: 11px; line-height: 1.5; max-height: 240px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
  .top5-empty { color: var(--text2); font-size: 13px; text-align: center; padding: 24px; }

  .result-detail { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .result-detail .label { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
  .result-detail .value { font-size: 13px; font-family: monospace; color: var(--text2); }

  /* OCR result */
  .ocr-result { display: none; margin-top: 16px; }
  .ocr-result.show { display: block; }
  .ocr-result .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; overflow: hidden;
  }
  .ocr-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
  }
  .ocr-header .label { font-size: 13px; font-weight: 600; color: var(--text); }
  .ocr-header .time { font-size: 12px; color: var(--text2); margin-left: auto; }

  .ocr-image-wrap {
    position: relative; display: inline-block; width: 100%;
    margin-bottom: 12px;
  }
  .ocr-image-wrap img { width: 100%; border-radius: 4px; display: block; }
  .ocr-image-wrap canvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
  }

  .ocr-blocks { margin-bottom: 12px; }
  .ocr-block-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 4px; font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .ocr-block-item:last-child { border-bottom: none; }
  .ocr-block-num {
    font-size: 11px; font-weight: 600; color: var(--text2);
    min-width: 20px; text-align: center;
  }
  .ocr-block-text { flex: 1; font-family: monospace; font-size: 13px; }
  .ocr-block-conf {
    display: flex; align-items: center; gap: 6px; min-width: 80px;
  }
  .ocr-conf-bar-outer { width: 40px; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .ocr-conf-bar-inner { height: 100%; border-radius: 3px; background: var(--green); transition: width 0.3s; }
  .ocr-conf-text { font-size: 11px; color: var(--text2); min-width: 32px; text-align: right; }

  .ocr-full-text { margin-top: 8px; }
  .ocr-full-text label { font-size: 11px; color: var(--text2); display: block; margin-bottom: 4px; }
  .ocr-full-text textarea {
    width: 100%; min-height: 80px; padding: 8px; border-radius: 4px;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text); font-family: monospace; font-size: 13px; resize: vertical;
  }

  .ocr-raw { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .ocr-raw .label { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
  .ocr-raw .value { font-size: 13px; font-family: monospace; color: var(--text2); }

  /* OCR match */
  .ocrmatch-result { display: none; margin-top: 16px; }
  .ocrmatch-result.show { display: block; }
  .ocrmatch-result .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; overflow: hidden;
  }
  .ocrmatch-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
  }
  .ocrmatch-header .label { font-size: 13px; font-weight: 600; color: var(--text); }
  .ocrmatch-header .time { font-size: 12px; color: var(--text2); margin-left: auto; }
  .ocrmatch-query {
    margin-bottom: 12px; padding: 8px 10px; background: var(--surface2);
    border-radius: 6px; font-family: monospace; font-size: 12px;
    color: var(--text2); max-height: 100px; overflow: auto; white-space: pre-wrap;
  }
  .ocrmatch-query .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
  .ocrmatch-list:first-child .top5-item { border-color: rgba(245,158,11,0.4); }

  .history { margin-top: 24px; }
  .history h2 { font-size: 14px; font-weight: 500; color: var(--text2); margin-bottom: 8px; }
  .history-list { display: flex; flex-direction: column; gap: 4px; }
  .history-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: var(--surface); border-radius: 6px;
    font-size: 13px; cursor: pointer; transition: background 0.15s;
  }
  .history-item:hover { background: var(--surface2); }
  .h-rank { font-size: 11px; font-weight: 600; color: var(--text2); min-width: 12px; }
  .history-item .h-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-item .h-score { font-family: monospace; color: var(--text2); font-size: 12px; }
  .history-empty { color: var(--text2); font-size: 13px; text-align: center; padding: 16px; }

  .spinner-full {
    display: none; justify-content: center; align-items: center; padding: 32px;
  }
  .spinner-full.show { display: flex; }
  .spinner-full .ring {
    width: 24px; height: 24px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite;
  }

  .lightbox {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.88); cursor: zoom-out;
    align-items: center; justify-content: center;
  }
  .lightbox.show { display: flex; }
  .lightbox img {
    max-width: 92vw; max-height: 88vh; border-radius: 8px;
    box-shadow: 0 12px 48px rgba(0,0,0,0.7); background: var(--surface);
  }
  .lightbox .lb-id {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    font-family: monospace; font-size: 14px; color: var(--text);
    background: var(--surface2); border: 1px solid var(--border);
    padding: 4px 12px; border-radius: 6px;
  }

  @media (max-width: 480px) {
    .container { padding: 16px 12px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>TCG 卡牌搜索</h1>
    <span class="badge">v0.1</span>
    <span class="status-dot" id="statusDot" title="服务器状态"></span>
  </header>

  <div class="tabs" id="tabBar">
    <button class="tab active" data-tab="search">搜索</button>
    <button class="tab" data-tab="ocr">OCR 文字识别</button>
  </div>

  <!-- Search Panel -->
  <div class="panel active" id="panel-search">
    <div class="drop-zone" id="dropZone">
      <div class="icon">&#x1F4F7;</div>
      <p>拖放卡牌图片到这里，或点击选择文件</p>
      <div class="hint">支持 JPG / PNG，最大 10MB</div>
      <input type="file" id="fileInput" accept="image/jpeg,image/png" hidden>
    </div>

    <div class="preview-area" id="previewArea">
      <img id="previewImg" alt="预览">
      <div class="preview-actions">
        <button class="btn" id="clearBtn">&#x2716; 清除</button>
        <button class="btn primary" id="searchBtn">
          <span class="spinner"></span>
          <span class="label">&#x1F50D; 搜索 Top-5</span>
        </button>
      </div>
    </div>

    <div class="spinner-full" id="loadingSpinner">
      <div class="ring"></div>
    </div>

    <div class="search-result" id="searchResult">
      <div class="card">
        <div class="warnings-bar" id="searchWarnings"></div>
        <div class="preprocess-result" id="searchPreprocess">
          <div class="preprocess-header">
            <span class="label">&#x1F4F0; 预处理结果</span>
          </div>
          <img id="searchPreprocessImg" alt="预处理">
          <div class="preprocess-hint" id="searchPreprocessHint">DINOv2 输入预览（168 × 224，归一化前）</div>
        </div>
        <div class="search-header">
          <span class="label">&#x1F50D; 搜索结果</span>
          <span class="time" id="searchTime"></span>
        </div>
        <div class="top5-list" id="top5List">
          <div class="top5-empty">无结果</div>
        </div>
        <div class="result-detail">
          <div class="label">原始响应</div>
          <div class="value" id="resultRaw"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- OCR Panel -->
  <div class="panel" id="panel-ocr">
    <div class="drop-zone" id="ocrDropZone">
      <div class="icon">&#x1F4DD;</div>
      <p>拖放卡牌图片到这里，或点击选择文件</p>
      <div class="hint">支持 JPG / PNG，最大 10MB</div>
      <input type="file" id="ocrFileInput" accept="image/jpeg,image/png" hidden>
    </div>

    <div class="preview-area" id="ocrPreviewArea">
      <img id="ocrPreviewImg" alt="预览">
      <div class="preview-actions">
        <button class="btn" id="ocrClearBtn">&#x2716; 清除</button>
        <button class="btn ocr" id="ocrBtn">
          <span class="spinner"></span>
          <span class="label">&#x1F50D; 识别文字</span>
        </button>
        <button class="btn primary" id="ocrMatchBtn">
          <span class="spinner"></span>
          <span class="label">&#x1F9E9; 文字匹配 Top-5</span>
        </button>
      </div>
    </div>

    <div class="spinner-full" id="ocrLoadingSpinner">
      <div class="ring"></div>
    </div>

    <div class="ocr-result" id="ocrResult">
      <div class="card">
        <div class="warnings-bar" id="ocrWarnings"></div>
        <div class="preprocess-result" id="ocrPreprocess">
          <div class="preprocess-header">
            <span class="label">&#x1F4F0; 预处理结果</span>
          </div>
          <img id="ocrPreprocessImg" alt="预处理">
          <div class="preprocess-hint">CLAHE 对比度增强 + 去噪 + 锐化 — 输入到 PP-OCRv4 模型</div>
        </div>
        <div class="ocr-header">
          <span class="label">&#x1F4DD; 识别结果</span>
          <span class="time" id="ocrTime"></span>
        </div>
        <div class="ocr-image-wrap" id="ocrImageWrap">
          <img id="ocrResultImg" alt="OCR 结果">
          <canvas id="ocrCanvas"></canvas>
        </div>
        <div class="ocr-blocks" id="ocrBlocks"></div>
        <div class="ocr-full-text">
          <label>全文</label>
          <textarea id="ocrFullText" readonly></textarea>
        </div>
        <div class="ocr-raw">
          <div class="label">原始响应</div>
          <div class="value" id="ocrRaw"></div>
        </div>
      </div>
    </div>

    <div class="ocrmatch-result" id="ocrMatchResult">
      <div class="card">
        <div class="warnings-bar" id="ocrMatchWarnings"></div>
        <div class="preprocess-result" id="ocrMatchPreprocess">
          <div class="preprocess-header">
            <span class="label">&#x1F4F0; 预处理结果</span>
          </div>
          <img id="ocrMatchPreprocessImg" alt="预处理">
          <div class="preprocess-hint">CLAHE 增强 + PP-OCRv4 识别 → bge-small 向量匹配</div>
        </div>
        <div class="ocrmatch-header">
          <span class="label">&#x1F9E9; 文字相似度匹配 Top-5</span>
          <span class="time" id="ocrMatchTime"></span>
        </div>
        <div class="ocrmatch-query" id="ocrMatchQuery"></div>
        <div class="top5-list ocrmatch-list" id="ocrMatchList">
          <div class="top5-empty">无结果</div>
        </div>
        <div class="result-detail">
          <div class="label">原始响应</div>
          <div class="value" id="ocrMatchRaw"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="history">
    <h2>查询历史</h2>
    <div class="history-list" id="historyList">
      <div class="history-empty">暂无记录</div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <div class="lb-id" id="lightboxId"></div>
  <img id="lightboxImg" alt="放大查看">
</div>

<script>
var API_BASE = '';

// ---- Shared ----
var dropZone = document.getElementById('dropZone');
var fileInput = document.getElementById('fileInput');
var previewArea = document.getElementById('previewArea');
var previewImg = document.getElementById('previewImg');
var clearBtn = document.getElementById('clearBtn');
var searchBtn = document.getElementById('searchBtn');
var loadingSpinner = document.getElementById('loadingSpinner');
var searchResult = document.getElementById('searchResult');
var searchTime = document.getElementById('searchTime');
var top5List = document.getElementById('top5List');
var resultRaw = document.getElementById('resultRaw');
var statusDot = document.getElementById('statusDot');
var historyList = document.getElementById('historyList');

// ---- OCR ----
var ocrDropZone = document.getElementById('ocrDropZone');
var ocrFileInput = document.getElementById('ocrFileInput');
var ocrPreviewArea = document.getElementById('ocrPreviewArea');
var ocrPreviewImg = document.getElementById('ocrPreviewImg');
var ocrClearBtn = document.getElementById('ocrClearBtn');
var ocrBtn = document.getElementById('ocrBtn');
var ocrLoadingSpinner = document.getElementById('ocrLoadingSpinner');
var ocrResult = document.getElementById('ocrResult');
var ocrTime = document.getElementById('ocrTime');
var ocrResultImg = document.getElementById('ocrResultImg');
var ocrCanvas = document.getElementById('ocrCanvas');
var ocrBlocks = document.getElementById('ocrBlocks');
var ocrFullText = document.getElementById('ocrFullText');
var ocrRaw = document.getElementById('ocrRaw');

// ---- OCR match ----
var ocrMatchBtn = document.getElementById('ocrMatchBtn');
var ocrMatchResult = document.getElementById('ocrMatchResult');
var ocrMatchTime = document.getElementById('ocrMatchTime');
var ocrMatchQuery = document.getElementById('ocrMatchQuery');
var ocrMatchList = document.getElementById('ocrMatchList');
var ocrMatchRaw = document.getElementById('ocrMatchRaw');

var currentFile = null;
var ocrCurrentFile = null;
var MAX_HISTORY = 20;
var searchHistory = loadHistory();

// ---- Tab switching ----
var tabBar = document.getElementById('tabBar');
tabBar.addEventListener('click', function(e) {
  var btn = e.target.closest('.tab');
  if (!btn) return;
  var tab = btn.dataset.tab;
  tabBar.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  btn.classList.add('active');
  document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('panel-' + tab).classList.add('active');
});

// ---- History ----
function loadHistory() {
  try {
    var parsed = JSON.parse(localStorage.getItem('tcg_history') || '[]');
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) { return []; }
}

function saveHistory() {
  try {
    localStorage.setItem('tcg_history', JSON.stringify(searchHistory.slice(0, MAX_HISTORY)));
  } catch (e) {}
}

function renderHistory() {
  if (searchHistory.length === 0) {
    historyList.innerHTML = '<div class="history-empty">\u6682\u65E0\u8BB0\u5F55</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < searchHistory.length; i++) {
    var h = searchHistory[i];
    var rank = h.top1 ? '#' + h.top1.rank : '#?';
    var name = h.fileName || 'unknown';
    var score = h.top1 ? h.top1.score.toFixed(4) : '-';
    html += '<div class="history-item" onclick="replayHistory(' + i + ')">' +
      '<span class="h-rank">' + rank + '</span>' +
      '<span class="h-name">' + escapeHtml(name) + '</span>' +
      '<span class="h-score">' + score + '</span>' +
      '</div>';
  }
  historyList.innerHTML = html;
}

function replayHistory(idx) {
  var h = searchHistory[idx];
  if (h && h.dataUrl) {
    showPreview(h.dataUrl, h.fileName);
    displaySearchResult(h.response, h.duration);
  }
}

function escapeHtml(s) {
  if (typeof s !== 'string') return String(s);
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderWarnings(el, warnings) {
  if (warnings && warnings.length) {
    el.innerHTML = warnings.map(function(w) {
      return '<div>⚠ ' + escapeHtml(w) + '</div>';
    }).join('');
    el.classList.add('show');
  } else {
    el.classList.remove('show');
  }
}

  previewArea.classList.add('show');
  dropZone.style.display = 'none';

}

function resetUpload() {

  dropZone.style.display = '';
  previewImg.src = '';

  fileInput.value = '';

// ---- OCR preview ----
function ocrShowPreview(dataUrl, fileName) {

  ocrPreviewArea.classList.add('show');

  ocrCurrentFile = { dataUrl: dataUrl, fileName: fileName };

function ocrResetUpload() {
  ocrPreviewArea.classList.remove('show');
  ocrDropZone.style.display = '';

// ---- Search ----
function displaySearchResult(data, durationMs) {
  var preprocessEl = document.getElementById('searchPreprocess');
  var preprocessImg = document.getElementById('searchPreprocessImg');
  if (data.preprocessed_image) {
    preprocessImg.src = 'data:image/jpeg;base64,' + data.preprocessed_image;
    preprocessEl.classList.add('show');
  } else {
    preprocessEl.classList.remove('show');
  }
  renderWarnings(document.getElementById('searchWarnings'), data.warnings);
  var prep = data.preprocessing;
  var hint = 'DINOv2 输入预览（168 × 224，归一化前）';
  if (prep && prep.selected) {
    var sourceNames = {card: '卡牌透视校正', enhanced_card: '卡牌透视校正 + 轻度增强', original: '整图回退'};
    hint += ' · ' + (sourceNames[prep.selected.source] || prep.selected.source);
    hint += ' · 候选旋转 ' + prep.selected.rotation_degrees + '°';
    hint += ' · 共 ' + prep.candidate_count + ' 个候选';
  }
  document.getElementById('searchPreprocessHint').textContent = hint;

  searchTime.textContent = (durationMs / 1000).toFixed(2) + 's';

  var results = data.results || [];
  if (results.length === 0) {
    top5List.innerHTML = '<div class="top5-empty">\u65E0\u7ED3\u679C</div>';
  } else {
    var maxScore = results[0].score;
    var html = '';
    for (var k = 0; k < results.length; k++) {
      var r = results[k];
      var barPct = Math.min(100, (r.score / maxScore) * 100);
      html += '<div class="top5-wrap">' +
        '<div class="top5-item">' +
        '<span class="top5-rank">#' + r.rank + '</span>' +
        '<img src="/v1/images/' + encodeURIComponent(r.card_id) + '" alt="' + escapeHtml(r.card_id) + '" data-id="' + escapeHtml(r.card_id) + '" loading="lazy" onerror="this.style.display=\'none\'">' +
        '<div class="top5-info">' +
        '<div class="top5-name">' + escapeHtml(r.product_name || r.card_id) + '</div>' +
        '<div class="top5-sub">' + escapeHtml(r.card_id) + '</div>' +
        '</div>' +
        '<span class="top5-score">' + r.score.toFixed(4) + '</span>' +
        '<div class="top5-bar-outer"><div class="top5-bar-inner" style="width:' + barPct + '%"></div></div>' +
        '</div>' +
        (r.product ? '<details class="top5-json"><summary>JSON 详情</summary><pre>' + escapeHtml(JSON.stringify(r.product, null, 2)) + '</pre></details>' : '') +
        '</div>';
    }
    top5List.innerHTML = html;
  }

  resultRaw.textContent = JSON.stringify(data, null, 2);
  searchResult.classList.add('show');

  if (currentFile) {
    searchHistory.unshift({
      fileName: currentFile.fileName,
      dataUrl: currentFile.dataUrl,
      top1: results.length > 0 ? results[0] : null,
      response: data,
      duration: durationMs,
      timestamp: Date.now()
    });
    saveHistory();
    renderHistory();
  }
}

async function doSearch() {
  if (!currentFile) return;
  searchBtn.classList.add('loading');
  searchBtn.disabled = true;
  loadingSpinner.classList.add('show');
  searchResult.classList.remove('show');

  var resp = await fetch(currentFile.dataUrl);
  var blob = await resp.blob();
  var formData = new FormData();
  formData.append('file', blob, currentFile.fileName || 'card.jpg');

  var t0 = performance.now();
  try {
    var res = await fetch(API_BASE + '/v1/search', { method: 'POST', body: formData });
    var dur = performance.now() - t0;
    var data = await res.json();
    displaySearchResult(data, dur);
  } catch (err) {
    var dur = performance.now() - t0;
    displaySearchResult({ status: 'error', results: [], message: err.message }, dur);
  } finally {
    searchBtn.classList.remove('loading');
    searchBtn.disabled = false;
    loadingSpinner.classList.remove('show');
  }
}

// ---- OCR ----
function drawBboxes(imgEl, canvas, blocks) {
  var rect = imgEl.getBoundingClientRect();
  canvas.width = imgEl.naturalWidth;
  canvas.height = imgEl.naturalHeight;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';

  var ctx = canvas.getContext('2d');
  var scaleX = imgEl.naturalWidth / rect.width;
  var scaleY = imgEl.naturalHeight / rect.height;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  var colors = ['#5b8def','#34d399','#f59e0b','#f87171','#a78bfa','#ec4899','#14b8a6','#f97316'];
  for (var i = 0; i < blocks.length; i++) {
    var b = blocks[i];
    var color = colors[i % colors.length];
    var pts = b.bbox;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2 * scaleX;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var j = 1; j < pts.length; j++) {
      ctx.lineTo(pts[j][0], pts[j][1]);
    }
    ctx.closePath();
    ctx.stroke();

    // label
    var cx = pts.reduce(function(s, p) { return s + p[0]; }, 0) / pts.length;
    var cy = pts.reduce(function(s, p) { return s + p[1]; }, 0) / pts.length;
    ctx.fillStyle = color;
    ctx.font = 'bold ' + (14 * scaleX) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('#' + (i + 1), cx, cy);
  }
}

function displayOcrResult(data, durationMs) {
  var preprocessEl = document.getElementById('ocrPreprocess');
  var preprocessImg = document.getElementById('ocrPreprocessImg');
  if (data.preprocessed_image) {
    preprocessImg.src = 'data:image/jpeg;base64,' + data.preprocessed_image;
    preprocessEl.classList.add('show');
  } else {
    preprocessEl.classList.remove('show');
  }
  renderWarnings(document.getElementById('ocrWarnings'), data.warnings);

  ocrTime.textContent = (durationMs / 1000).toFixed(2) + 's';

  var blocks = data.blocks || [];

  // Show preprocessed image as the base: bbox coordinates are in its space
  if (data.preprocessed_image) {
    ocrResultImg.src = 'data:image/jpeg;base64,' + data.preprocessed_image;
  } else if (ocrCurrentFile) {
    ocrResultImg.src = ocrCurrentFile.dataUrl;
  }
  ocrResultImg.onload = function() {
    drawBboxes(ocrResultImg, ocrCanvas, blocks);
  };

  // Block list
  if (blocks.length === 0) {
    ocrBlocks.innerHTML = '<div style="color:var(--text2);font-size:13px;padding:12px;text-align:center;">未识别到文字</div>';
  } else {
    var html = '';
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      var confPct = Math.round(b.confidence * 100);
      var colors = ['#5b8def','#34d399','#f59e0b','#f87171','#a78bfa','#ec4899','#14b8a6','#f97316'];
      var barColor = confPct > 80 ? '#34d399' : (confPct > 50 ? '#f59e0b' : '#f87171');
      html += '<div class="ocr-block-item">' +
        '<span class="ocr-block-num" style="color:' + colors[i % colors.length] + '">#' + (i + 1) + '</span>' +
        '<span class="ocr-block-text">' + escapeHtml(b.text) + '</span>' +
        '<span class="ocr-block-conf">' +
          '<div class="ocr-conf-bar-outer"><div class="ocr-conf-bar-inner" style="width:' + confPct + '%;background:' + barColor + '"></div></div>' +
          '<span class="ocr-conf-text">' + confPct + '%</span>' +
        '</span>' +
        '</div>';
    }
    ocrBlocks.innerHTML = html;
  }

  ocrFullText.value = data.full_text || '';
  ocrRaw.textContent = JSON.stringify(data, null, 2);
  ocrResult.classList.add('show');
}

async function doOcr() {
  if (!ocrCurrentFile) return;
  ocrBtn.classList.add('loading');
  ocrBtn.disabled = true;
  ocrLoadingSpinner.classList.add('show');
  ocrResult.classList.remove('show');

  var resp = await fetch(ocrCurrentFile.dataUrl);
  var blob = await resp.blob();
  var formData = new FormData();
  formData.append('file', blob, ocrCurrentFile.fileName || 'card.jpg');

  var t0 = performance.now();
  try {
    var res = await fetch(API_BASE + '/v1/ocr', { method: 'POST', body: formData });
    var dur = performance.now() - t0;
    var data = await res.json();
    displayOcrResult(data, dur);
  } catch (err) {
    var dur = performance.now() - t0;
    displayOcrResult({ status: 'error', total_blocks: 0, blocks: [], full_text: '', message: err.message }, dur);
  } finally {
    ocrBtn.classList.remove('loading');
    ocrBtn.disabled = false;
    ocrLoadingSpinner.classList.remove('show');
  }
}

// ---- OCR match: OCR text -> bge embedding -> product text-index top-5 ----
function displayOcrMatchResult(data, durationMs) {
  var preprocessEl = document.getElementById('ocrMatchPreprocess');
  var preprocessImg = document.getElementById('ocrMatchPreprocessImg');
  if (data.preprocessed_image) {
    preprocessImg.src = 'data:image/jpeg;base64,' + data.preprocessed_image;
    preprocessEl.classList.add('show');
  } else {
    preprocessEl.classList.remove('show');
  }
  renderWarnings(document.getElementById('ocrMatchWarnings'), data.warnings);

  ocrMatchTime.textContent = (durationMs / 1000).toFixed(2) + 's';

  ocrMatchQuery.innerHTML = '<span class="label">OCR 识别文字（用于匹配）</span>' + escapeHtml(data.query_text || '(空)');

  var results = data.results || [];
  if (results.length === 0) {
    ocrMatchList.innerHTML = '<div class="top5-empty">无结果</div>';
  } else {
    var maxScore = results[0].score;
    var html = '';
    for (var k = 0; k < results.length; k++) {
      var r = results[k];
      var barPct = Math.min(100, (r.score / maxScore) * 100);
      var imgId = r.product_id + '_200w';
      var sub = [r.set_name, r.number, r.rarity].filter(Boolean).join(' · ');
      html += '<div class="top5-wrap">' +
        '<div class="top5-item">' +
        '<span class="top5-rank">#' + r.rank + '</span>' +
        (r.has_image
          ? '<img src="/v1/images/' + encodeURIComponent(imgId) + '" alt="' + escapeHtml(imgId) + '" data-id="' + escapeHtml(imgId) + '" loading="lazy" onerror="this.style.display=\'none\'">'
          : '<img src="" alt="无图片" style="display:none">') +
        '<div class="top5-info">' +
        '<div class="top5-name">' + escapeHtml(r.product_name || r.product_id) + '</div>' +
        '<div class="top5-sub">' + escapeHtml(sub || r.product_id) + '</div>' +
        '</div>' +
        '<span class="top5-score">' + r.score.toFixed(4) + '</span>' +
        '<div class="top5-bar-outer"><div class="top5-bar-inner" style="width:' + barPct + '%"></div></div>' +
        '</div>' +
        (r.product && Object.keys(r.product).length
          ? '<details class="top5-json"><summary>JSON 详情</summary><pre>' + escapeHtml(JSON.stringify(r.product, null, 2)) + '</pre></details>'
          : '') +
        '</div>';
    }
    ocrMatchList.innerHTML = html;
  }

  ocrMatchRaw.textContent = JSON.stringify(data, null, 2);
  ocrMatchResult.classList.add('show');
}

async function doOcrMatch() {
  if (!ocrCurrentFile) return;
  ocrMatchBtn.classList.add('loading');
  ocrMatchBtn.disabled = true;
  ocrLoadingSpinner.classList.add('show');
  ocrMatchResult.classList.remove('show');

  var resp = await fetch(ocrCurrentFile.dataUrl);
  var blob = await resp.blob();
  var formData = new FormData();
  formData.append('file', blob, ocrCurrentFile.fileName || 'card.jpg');

  var t0 = performance.now();
  try {
    var res = await fetch(API_BASE + '/v1/ocr-match', { method: 'POST', body: formData });
    var dur = performance.now() - t0;
    var data = await res.json();
    displayOcrMatchResult(data, dur);
  } catch (err) {
    var dur = performance.now() - t0;
    displayOcrMatchResult({ status: 'error', query_text: '', results: [], message: err.message }, dur);
  } finally {
    ocrMatchBtn.classList.remove('loading');
    ocrMatchBtn.disabled = false;
    ocrLoadingSpinner.classList.remove('show');
  }
}

// ---- Lightbox: click a top-5 thumbnail to zoom ----
var lightbox = document.getElementById('lightbox');
var lightboxImg = document.getElementById('lightboxImg');
var lightboxId = document.getElementById('lightboxId');

function openLightbox(cardId) {
  lightboxImg.src = '/v1/images/' + encodeURIComponent(cardId);
  lightboxId.textContent = cardId;
  lightbox.classList.add('show');
}

function closeLightbox() {
  lightbox.classList.remove('show');
  lightboxImg.src = '';
}

top5List.addEventListener('click', function(e) {
  var img = e.target.closest('.top5-item img');
  if (img) openLightbox(img.getAttribute('data-id'));
});
ocrMatchList.addEventListener('click', function(e) {
  var img = e.target.closest('.top5-item img');
  if (img) openLightbox(img.getAttribute('data-id'));
});
lightbox.addEventListener('click', closeLightbox);
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeLightbox();
});

// ---- Health check ----
async function checkHealth() {
  try {
    var res = await fetch(API_BASE + '/v1/health');
    if (res.ok) {
      statusDot.className = 'status-dot ok';
      statusDot.title = 'Server OK';
    } else {
      statusDot.className = 'status-dot err';
      statusDot.title = 'Server error';
    }
  } catch (e) {
    statusDot.className = 'status-dot err';
    statusDot.title = 'Server unreachable';
  }
}

// ---- Events: Search ----
dropZone.addEventListener('click', function() { fileInput.click(); });
dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('drag-over'); });
dropZone.addEventListener('drop', function(e) {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  var file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) {
    var reader = new FileReader();
    reader.onload = function(ev) { showPreview(ev.target.result, file.name); };
    reader.readAsDataURL(file);
  }
});

fileInput.addEventListener('change', function() {
  var file = fileInput.files[0];
  if (file) {
    var reader = new FileReader();
    reader.onload = function(ev) { showPreview(ev.target.result, file.name); };
    reader.readAsDataURL(file);
  }
});

clearBtn.addEventListener('click', resetUpload);
searchBtn.addEventListener('click', doSearch);

// ---- Events: OCR ----
ocrDropZone.addEventListener('click', function() { ocrFileInput.click(); });
ocrDropZone.addEventListener('dragover', function(e) { e.preventDefault(); ocrDropZone.classList.add('drag-over'); });
ocrDropZone.addEventListener('dragleave', function() { ocrDropZone.classList.remove('drag-over'); });
ocrDropZone.addEventListener('drop', function(e) {
  e.preventDefault();
  ocrDropZone.classList.remove('drag-over');
  var file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) {
    var reader = new FileReader();
    reader.onload = function(ev) { ocrShowPreview(ev.target.result, file.name); };
    reader.readAsDataURL(file);
  }
});

ocrFileInput.addEventListener('change', function() {
  var file = ocrFileInput.files[0];
  if (file) {
    var reader = new FileReader();
    reader.onload = function(ev) { ocrShowPreview(ev.target.result, file.name); };
    reader.readAsDataURL(file);
  }
});

ocrClearBtn.addEventListener('click', ocrResetUpload);
ocrBtn.addEventListener('click', doOcr);
ocrMatchBtn.addEventListener('click', doOcrMatch);

// ---- Init ----
checkHealth();
setInterval(checkHealth, 30000);
renderHistory();
</script>
