    - data:
        code: |-
          import json
          import re
          import ssl
          from datetime import datetime, timezone
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          API_URL = ""
          SETS_URL = ""
          LEGACY_API_KEY = ""


          def _clean(value):
              return str(value or "").strip()


          def _request_json(url):
              request = Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "BallStarCard-Dify/1.0",
                      "x-api-key": LEGACY_API_KEY,
                  },
                  method="GET",
              )
              try:
                  with urlopen(request, timeout=15) as response:
                      body = response.read().decode("utf-8")
              except URLError as exc:
                  error_text = str(exc).upper()
                  if (
                      "CERTIFICATE_VERIFY_FAILED" not in error_text
                      and "UNABLE TO GET LOCAL ISSUER CERTIFICATE" not in error_text
                  ):
                      raise
                  context = ssl.create_default_context()
                  context.check_hostname = True
                  context.verify_mode = ssl.CERT_REQUIRED
                  with urlopen(request, timeout=15, context=context) as response:
                      body = response.read().decode("utf-8")
              return json.loads(body)


          def _normalized(value):
              return re.sub(r"[^a-z0-9]+", "", _clean(value).lower())


          def _resolve_set_id(set_name):
              query = _clean(set_name)
              if not query:
                  return ""
              payload = _request_json(SETS_URL + "?" + urlencode({"q": query}))
              target = _normalized(query)
              candidates = [item for item in payload.get("data") or [] if isinstance(item, dict)]
              for item in candidates:
                  if _normalized(item.get("name")) == target or _normalized(item.get("id")) == target:
                      return _clean(item.get("id"))
              return _clean(candidates[0].get("id")) if len(candidates) == 1 else ""


          def _price_trend(payload):
              for card in payload.get("data") or []:
                  if not isinstance(card, dict):
                      continue
                  for variant in card.get("variants") or []:
                      if not isinstance(variant, dict):
                          continue
                      by_date = {}
                      for point in variant.get("priceHistory") or []:
                          if not isinstance(point, dict):
                              continue
                          try:
                              price = round(float(point.get("p")), 2)
                              sold_date = datetime.fromtimestamp(
                                  float(point.get("t")), timezone.utc
                              ).date().isoformat()
                          except (TypeError, ValueError, OverflowError, OSError):
                              continue
                          by_date[sold_date] = {
                              "price": {
                                  "raw": "${:.2f}".format(price),
                                  "extracted": price,
                              },
                              "soldDate": sold_date,
                          }
                      if by_date:
                          trend = [by_date[key] for key in sorted(by_date)]
                          if len(trend) <= 69:
                              return trend
                          last_index = len(trend) - 1
                          return [trend[round(index * last_index / 68)] for index in range(69)]
              return []


          def main(cardName="", setName="", cardNumber="", **kwargs):
              # This disconnected legacy node must never make an external price request.
              return {"priceTrend": []}
              try:
                  params = {
                      "q": _clean(cardName),
                      "set": _resolve_set_id(setName),
                      "number": _clean(cardNumber),
                      "condition": "NM",
                      "priceHistoryDuration": "30d",
                      "limit": 20,
                  }
                  params = {key: value for key, value in params.items() if value != ""}
                  payload = _request_json(API_URL + "?" + urlencode(params))
                  return {"priceTrend": _price_trend(payload)}
              except (HTTPError, URLError, TimeoutError, OSError, ValueError, json.JSONDecodeError):
                  return {"priceTrend": []}
