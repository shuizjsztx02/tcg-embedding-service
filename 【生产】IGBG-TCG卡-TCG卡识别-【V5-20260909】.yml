    - data:
        code: |-
          def _to_bool(value):
              if isinstance(value, bool):
                  return value
              if isinstance(value, str):
                  normalized = value.strip().lower()
                  if normalized in ('true', '1', 'yes'):
                      return True
                  if normalized in ('false', '0', 'no', ''):
                      return False
              return bool(value)


          def _pick_dict(primary=None, fallback=None):
              if primary and isinstance(primary, dict):
                  return primary
              if fallback and isinstance(fallback, dict):
                  return fallback
              return {}


          def _number(value):
              try:
                  number = float(value)
              except (TypeError, ValueError):
                  return None
              return number if number > 0 else None


          def _percentile(values, ratio):
              position = (len(values) - 1) * ratio
              lower = int(position)
              upper = min(lower + 1, len(values) - 1)
              weight = position - lower
              return values[lower] * (1 - weight) + values[upper] * weight


          def _market_prices(price_trend):
              values = []
              for point in price_trend or []:
                  if not isinstance(point, dict):
                      continue
                  price = point.get('price') or {}
                  value = _number(price.get('extracted') if isinstance(price, dict) else None)
                  if value is not None:
                      values.append(value)
              values.sort()
              if len(values) < 4:
                  return values
              q1 = _percentile(values, 0.25)
              q3 = _percentile(values, 0.75)
              iqr = q3 - q1
              if iqr <= 0:
                  return values
              lower_bound = q1 - 1.5 * iqr
              upper_bound = q3 + 1.5 * iqr
              filtered = [value for value in values if lower_bound <= value <= upper_bound]
              return filtered or values


          def _median(values):
              middle = len(values) // 2
              if len(values) % 2:
                  return values[middle]
              return (values[middle - 1] + values[middle]) / 2


          def _grade_multiplier(value):
              grade = _number(value)
              if grade is None:
                  return 1.0
              if grade >= 7:
                  return 1.0 + (min(grade, 10) - 7) * 0.5
              return max(0.65, 1.0 - (7 - grade) * 0.1)


          def _apply_market_valuation(result, price_trend):
              prices = _market_prices(price_trend)
              if not prices:
                  return
              if str(result.get('gradingStatus') or 'RAW').strip().upper() != 'GRADED':
                  result['marketValuationAvg'] = round(sum(prices) / len(prices), 2)
                  return
              raw_reference = _median(prices) * _grade_multiplier(result.get('gradingValue'))
              llm_value = _number(result.get('marketValuationAvg'))
              if llm_value is None:
                  result['marketValuationAvg'] = round(raw_reference, 2)
                  return
              result['marketValuationAvg'] = round(llm_value * 0.7 + raw_reference * 0.3, 2)


          def main(source1=None, source1_fallback=None, priceTrend=None, **kwargs):
              result = dict(_pick_dict(source1, source1_fallback))
              state = _to_bool(result.get('state', True))
              if not state:
                  return {
                      'merged_output': {
                          'state': False,
                          'isSportsCard': _to_bool(result.get('isSportsCard', False)),
                          'stateErrorReason': str(result.get('stateErrorReason') or '').strip(),
                      }
                  }

              result['state'] = True
              result['stateErrorReason'] = str(result.get('stateErrorReason') or '').strip()
              _apply_market_valuation(result, priceTrend)
              result['priceTrend'] = priceTrend if isinstance(priceTrend, list) else []
              result.pop('seriesNameLlm', None)
              return {'merged_output': result}
